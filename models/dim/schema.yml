models: 


  - name: dim_hosts_cleaned
    description: "This table derives data from source src hosts."
    tests: 
      - minimum_row_count:
         min_row_count: 100

    columns: 
      - name: host_id
        description: "This represents the host id."
        tests: 
          - dbt_utils.not_null_proportion:
              arguments:
                at_least: 0.95
          - anil_positive_values
          - unique
          - relationships:  
              to : ref('src_hosts')
              field : host_id

      - name: host_name
        description: "This represents the host name."
        tests: 
          - not_null
      - name: is_superhost
        description: "This represents if the host is a superhost."
        tests: 
          - not_null
          - accepted_values: 
              values: [true, false] 
              quote : false
      - name: created_at
        tests: 
          - not_null
      - name: updated_at
        tests: 
          - not_null



  - name: dim_listings_cleaned
    description: "This table derives data from source src_listings."

    columns:
      - name: listing_id
        description: "This represents the listing id."
        tests:
          - unique
          - not_null

      - name: listing_url
        description: "This represents the listing URL."
        tests:
          - not_null

      - name: listing_name
        description: "This represents the listing name."

      - name: room_type
        description: "This represents the room type."
        tests:
          - not_null

      - name: minimum_nights
        description: "Minimum number of nights required to book the listing."

      - name: host_id
        description: "Host associated with the listing."
        tests:
          - not_null  

      - name: price_str
        description: "Listing price."

      - name: created_at
        description: "Timestamp when the listing record was created."
        tests:
          - not_null

      - name: updated_at
        description: "Timestamp when the listing record was last updated."
        tests:
          - not_null


  - name: dim_listings_w_hosts
    description: "This table derives data from listings and hosts."

    columns:
      - name: listing_id
        description: "This represents the listing id."
        tests:
          - unique
          - not_null

      - name: listing_name
        description: "This represents the listing name."

      - name: listing_url
        description: "This represents the listing URL."
        tests:
          - not_null

      - name: room_type
        description: "This represents the room type."
        tests:
          - not_null
          - accepted_values:
              values:
                - Entire home/apt
                - Private room
                - Shared room
                - Hotel room

      - name: price_str
        description: "Listing price."

      - name: minimum_nights
        description: "Minimum number of nights required to book the listing."

      - name: host_id
        description: "Host associated with the listing."
        tests:
          - not_null
          - relationships:
              to: ref('dim_hosts_cleaned')
              field: host_id

      - name: host_name
        description: "Host name."
        tests:
          - not_null

      - name: is_superhost
        description: "Indicates whether the host is a superhost."
        tests:
          - not_null
          - accepted_values:
              values: [true, false]
              quote: false

      - name: created_at
        description: "Timestamp when the record was created."
        tests:
          - not_null

      - name: updated_at
        description: "Timestamp when the record was updated."
        tests:
          - not_null